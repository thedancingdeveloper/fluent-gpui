[package]
name = "fluent-layout"
version = "2.2.0"
edition = "2021"
license = "Apache-2.0"
description = "Pane splitting, dock panels, tab strips, and modal stack for FluentGUI"
repository = "https://github.com/AusAgentSmith-org/fluent-gpui"
keywords = ["gui", "fluent", "gpui", "layout", "docking"]
categories = ["gui"]

[dependencies]
gpui             = { workspace = true }
fluent-core      = { workspace = true }
fluent-ribbon    = { workspace = true }

[dev-dependencies]
fluent-test-utils = { workspace = true }
gpui = { workspace = true, features = ["test-support"] }

[package.metadata.estate-gpui]
# Must equal the zed commit in vendor/zed/UPSTREAM.md (scripts/check-zed-rev.sh).
zed-rev = "ba63a022c9a22ca66d68ef2a8f0bb9b5b0a9984d"
