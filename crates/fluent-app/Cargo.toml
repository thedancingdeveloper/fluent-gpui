[package]
name = "fluent-app"
version = "2.3.0"
edition = "2021"
license = "Apache-2.0"
description = "Application entry point for FluentGUI: window chrome, title bar, FluentApp builder"
repository = "https://github.com/AusAgentSmith-org/fluent-gpui"
keywords = ["gui", "fluent", "gpui", "app"]
categories = ["gui"]

[dependencies]
gpui            = { workspace = true }
fluent-core     = { workspace = true }
fluent-layout   = { workspace = true }

[package.metadata.estate-gpui]
# Must equal the zed commit in vendor/zed/UPSTREAM.md (scripts/check-zed-rev.sh).
zed-rev = "ba63a022c9a22ca66d68ef2a8f0bb9b5b0a9984d"
