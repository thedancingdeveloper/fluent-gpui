[package]
name = "gpui_wgpu"
version = "0.1.0"
edition = "2024"
publish = false
license = "Apache-2.0"

[lib]
path = "src/gpui_wgpu.rs"
doctest = false

[features]
default = []
bench-support = ["gpui/bench-support", "dep:image"]
font-kit = ["dep:font-kit"]
test-support = ["gpui/test-support", "dep:image"]

[dependencies]
gpui = { path = "../gpui" }
anyhow = { version = "1.0.86" }
bytemuck = { version = "1" }
collections = { path = "../collections" }
cosmic-text = "0.19.0"
etagere = { version = "0.2" }
itertools = { version = "0.14.0" }
image = { version = "0.25.1", default-features = false, features = ["bmp", "dds", "exr", "ff", "gif", "hdr", "ico", "jpeg", "png", "pnm", "qoi", "rayon", "tga", "tiff", "webp"], optional = true }
log = { version = "0.4", default-features = false, features = ["std"] }
parking_lot = { version = "0.12.1" }
profiling = { version = "1" }
raw-window-handle = { version = "0.6" }
smallvec = { version = "1.6", features = ["union", "const_new"] }
swash = { version = "0.2.6" }
unicode-bidi = { version = "0.3.18", default-features = false, features = ["hardcoded-data"] }
unicode-segmentation = { version = "1.10" }
gpui_util = { path = "../gpui_util" }

# Optional: only needed on platforms with multiple font sources (e.g. Linux)
# WARNING: If you change this, you must also publish a new version of zed-font-kit to crates.io
font-kit = { git = "https://github.com/zed-industries/font-kit", rev = "94b0f28166665e8fd2f53ff6d268a14955c82269", package = "zed-font-kit", version = "0.14.1-zed", default-features = false, optional = true }

[target.'cfg(any(target_os = "linux", target_os = "freebsd"))'.dependencies]
wgpu = { version = "29.0", default-features = false, features = ["std", "parking_lot", "metal", "gles", "vulkan", "wgsl", "webgpu"] }

[target.'cfg(not(any(target_os = "linux", target_os = "freebsd")))'.dependencies]
wgpu = { version = "29.0", default-features = true }

[target.'cfg(target_family = "wasm")'.dependencies]
web-sys = { version = "0.3", features = ["HtmlCanvasElement"] }
wgpu = { version = "29.0", default-features = false, features = ["webgl"] }

[dev-dependencies]
criterion = { version = "0.8.2", features = ["html_reports"] }
gpui = { path = "../gpui", features = ["bench-support"] }
image = { version = "0.25.1", default-features = false, features = ["bmp", "dds", "exr", "ff", "gif", "hdr", "ico", "jpeg", "png", "pnm", "qoi", "rayon", "tga", "tiff", "webp"] }
naga = { version = "29.0.4", features = ["wgsl-in"] }

[[bench]]
name = "layout_line"
harness = false
