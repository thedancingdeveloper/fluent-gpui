[package]
name = "gpui_macros"
version = "0.1.0"
edition = "2024"
publish = false
license = "Apache-2.0"
description = "Macros used by gpui"

[features]
inspector = []

[lib]
path = "src/gpui_macros.rs"
proc-macro = true
doctest = true
test = false

[dependencies]
heck = { version = "0.5" }
proc-macro2 = { version = "1.0.93" }
quote = { version = "1.0.9" }
syn = { version = "2.0", default-features = true, features = ["proc-macro", "full", "extra-traits", "visit-mut"] }

[dev-dependencies]
gpui = { path = "../gpui", features = ["inspector"] }
