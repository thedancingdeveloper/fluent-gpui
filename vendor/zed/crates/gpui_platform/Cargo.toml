[package]
name = "gpui_platform"
version = "0.1.0"
edition = "2024"
publish = false
license = "Apache-2.0"

[lib]
path = "src/gpui_platform.rs"
doctest = false

[features]
default = ["multithreaded"]
# Threads in the browser: needs a nightly toolchain and a cross-origin-isolated
# page. Off, gpui_web builds on stable.
multithreaded = []
bench-support = ["gpui/bench-support", "gpui_wgpu/bench-support"]
font-kit = []
inspector = ["gpui/inspector"]
test-support = ["gpui/test-support", "gpui_windows/test-support", "gpui_wgpu/test-support"]
screen-capture = ["gpui/screen-capture", "gpui_windows/screen-capture", "gpui_linux/screen-capture"]
wayland = ["gpui_linux/wayland"]
x11 = ["gpui_linux/x11"]

[[bench]]
name = "atlas_upload"
harness = false
required-features = ["bench-support"]

[[bench]]
name = "focus_cleanup"
path = "../gpui/benches/focus_cleanup.rs"
harness = false
required-features = ["bench-support"]

[[bench]]
name = "inspector_render"
harness = false
required-features = ["bench-support"]

[[bench]]
name = "randomized_element_tree"
harness = false
required-features = ["bench-support"]

[dependencies]
anyhow = { version = "1.0.86" }
gpui = { path = "../gpui" }

[dev-dependencies]
bench_metrics = { path = "../bench_metrics" }
criterion = { version = "0.8.2", features = ["html_reports"] }

[target.'cfg(target_os = "macos")'.dependencies]

[target.'cfg(target_os = "ios")'.dependencies]

[target.'cfg(target_os = "windows")'.dependencies]
gpui_windows = { path = "../gpui_windows" }
gpui = { path = "../gpui", features = ["windows-manifest"] }

[target.'cfg(all(any(target_os = "linux", target_os = "freebsd"), not(target_env = "ohos")))'.dependencies]
gpui_linux = { path = "../gpui_linux" }

[target.'cfg(target_os = "linux")'.dependencies]
gpui_wgpu = { path = "../gpui_wgpu", optional = true }

[target.'cfg(target_family = "wasm")'.dependencies]
console_error_panic_hook = { version = "0.1.7" }
