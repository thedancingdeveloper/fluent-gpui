[package]
name = "zlog"
version = "0.1.0"
edition = "2024"
publish = false
license = "Apache-2.0"

[lib]
path = "src/zlog.rs"
doctest = false

[features]
default = []

[dependencies]
collections = { path = "../collections" }
chrono = { version = "0.4", default-features = true, features = ["std", "serde"] }
log = { version = "0.4", default-features = false, features = ["std", "kv_unstable_std"] }
anyhow = { version = "1.0.86" }

[dev-dependencies]
tempfile = { version = "3.20.0" }
