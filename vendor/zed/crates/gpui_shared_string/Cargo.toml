[package]
name = "gpui_shared_string"
version = "0.1.0"
publish = false
edition = "2024"
license = "Apache-2.0"

[lib]
path = "gpui_shared_string.rs"
test = false
doctest = false

[dependencies]
schemars = { version = "1.0", default-features = false, features = ["std", "indexmap2"] }
serde = { version = "1.0", features = ["rc"] }
smol_str = { version = "0.3.6", default-features = false, features = ["serde"] }
