[workspace]
resolver = "2"
members = [
    "crates/fluent-core",
    "crates/fluent-primitives",
    "crates/fluent-ribbon",
    "crates/fluent-layout",
    "crates/fluent-app",
    "crates/fluent-test-utils",
    # The published gpui 0.2 fork at crates/gpui is not a member while the
    # vendored upstream snapshot supplies the gpui package. See
    # docs/gpui-migration-plan.md §3.2.
    "vendor/zed/crates/gpui",
    "vendor/zed/crates/gpui_platform",
    "vendor/zed/crates/gpui_linux",
    "vendor/zed/crates/gpui_wgpu",
    "vendor/zed/crates/gpui_macros",
    "vendor/zed/crates/gpui_util",
    "vendor/zed/crates/gpui_shared_string",
    "vendor/zed/crates/bench_metrics",
    "vendor/zed/crates/collections",
    "vendor/zed/crates/derive_refineable",
    "vendor/zed/crates/http_client",
    "vendor/zed/crates/http_client_tls",
    "vendor/zed/crates/path",
    "vendor/zed/crates/perf",
    "vendor/zed/crates/refineable",
    "vendor/zed/crates/reqwest_client",
    "vendor/zed/crates/scheduler",
    "vendor/zed/crates/sum_tree",
    "vendor/zed/crates/util",
    "vendor/zed/crates/util_macros",
    "vendor/zed/crates/zlog",
    "vendor/zed/crates/ztracing",
    "vendor/zed/crates/ztracing_macro",
    "examples/gallery",
    "examples/demo_app",
    "examples/hello_world",
    "examples/widgets",
    "examples/form",
    "examples/screenshots",
]

[workspace.dependencies]
gpui = { path = "vendor/zed/crates/gpui", version = "0.2" }

fluent-core        = { path = "crates/fluent-core",        version = "2.4.0" }
fluent-primitives  = { path = "crates/fluent-primitives",  version = "2.4.0" }
fluent-ribbon      = { path = "crates/fluent-ribbon",      version = "2.0.2" }
fluent-layout      = { path = "crates/fluent-layout",      version = "2.2.0" }
fluent-app         = { path = "crates/fluent-app",         version = "2.3.0" }
fluent-test-utils  = { path = "crates/fluent-test-utils" }
