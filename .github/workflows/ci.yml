name: CI

on:
  push:
  pull_request:
  merge_group:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - name: Install Linux system libraries
        if: runner.os == 'Linux'
        # gpui's Linux backend (x11rb/xkbcommon/wayland/blade/font-kit) links
        # these; the list follows zed's script/linux apt packages.
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libxcb1-dev libx11-xcb-dev libxkbcommon-dev libxkbcommon-x11-dev \
            libwayland-dev libvulkan-dev libfontconfig-dev libfreetype-dev
      - uses: dtolnay/rust-toolchain@d124f86f28ff42855784ff3319f48ac182c248f8
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@e9d7b9f1e587218970671bac74e5511ed9506e6a
      - uses: taiki-e/install-action@97888a140839b7239d62fbf6af4e20adb5be3666
        with:
          tool: nextest
      - name: Check format
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Test
        shell: bash
        run: scripts/ci-nextest.sh

  # Only crates/fluent-* may use gpui (CONTRIBUTING.md §2).
  layering:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: dtolnay/rust-toolchain@d124f86f28ff42855784ff3319f48ac182c248f8
      - name: Layering guard
        run: python3 scripts/check-layering.py

  # Licence allow-list with no GPL/LGPL/AGPL exception, and the gpui bans
  # (deny.toml, CONTRIBUTING.md §4).
  deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25
        with:
          command: check licenses bans

  # fluent-* zed-rev metadata equals vendor/zed/UPSTREAM.md (CONTRIBUTING.md §4).
  zed-rev:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Check recorded zed rev
        run: scripts/check-zed-rev.sh

  # The one required check: Windows and Linux tests plus every guard.
  ci:
    if: always()
    needs: [test, layering, deny, zed-rev]
    runs-on: ubuntu-latest
    steps:
      - name: All jobs passed
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          echo "$NEEDS" | python3 -c 'import json,sys; n=json.load(sys.stdin); bad=[k for k,v in n.items() if v["result"]!="success"]; print("failed:", bad) if bad else print("ok"); sys.exit(1 if bad else 0)'
