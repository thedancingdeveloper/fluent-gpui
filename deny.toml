# cargo deny policy (WI-1424, WI-2725). Run: cargo deny check licenses bans
#
# Licences: permissive allow-list only. There is NO GPL, LGPL or AGPL
# exception of any kind, and no per-crate `exceptions` entry may add one. A
# dependency (vendored snapshot included) that can only be taken under a
# copyleft licence fails CI rather than being recorded as debt. An `OR`
# expression passes when one allowed alternative is present.

[graph]
all-features = false

[licenses]
confidence-threshold = 0.9
allow = [
    "0BSD",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CC0-1.0",
    "ISC",
    "MIT",
    "MIT-0",
    "NCSA",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "Unlicense",
    "Zlib",
]
# MPL-2.0 is not on the allow-list. These crates are forced by the gpui tree
# and are allowed one by one; a new MPL crate fails CI. Accepted by the
# operator on 2026-10-31. Never add a GPL/LGPL/AGPL entry here.
exceptions = [
    { name = "cbindgen", allow = ["MPL-2.0"] },    # forced by gpui (build dependency)
    { name = "dwrote", allow = ["MPL-2.0"] },      # forced by gpui (Windows DirectWrite text, via font-kit/gpui)
    { name = "option-ext", allow = ["MPL-2.0"] },  # forced by dirs-sys, via dirs (gpui/util)
]

[licenses.private]
ignore = true

[advisories]
# These advisories are currently reachable through the pinned vendored Zed
# snapshot or its platform dependencies. Keep the exceptions explicit so a
# newly introduced advisory still fails this check.
ignore = [
    { id = "RUSTSEC-2026-0194", reason = "quick-xml is pinned by vendored wayland-scanner and zed-scap; compatible refresh is blocked upstream (WI-3116)" },
    { id = "RUSTSEC-2026-0195", reason = "quick-xml is pinned by vendored wayland-scanner and zed-scap; compatible refresh is blocked upstream (WI-3116)" },
    { id = "RUSTSEC-2026-0204", reason = "crossbeam-epoch is pinned by the vendored Zed snapshot; compatible refresh is blocked upstream (WI-3116)" },
    { id = "RUSTSEC-2026-0206", reason = "rustybuzz 0.20.1 is pinned through vendored Zed's usvg 0.46.0; it parses only app-bundled font data (WI-3116)" },
    { id = "RUSTSEC-2026-0192", reason = "ttf-parser 0.25.1 is pinned through vendored Zed's fontdb 0.23.0; it parses only app-bundled font data (WI-3116)" },
    { id = "RUSTSEC-2026-0371", reason = "zbus_names 4.3.5 is pinned by vendored Zed's zbus 5.15/accessibility stack; it handles local session-bus metadata (WI-3116)" },
    { id = "RUSTSEC-2026-0370", reason = "zvariant 5.15.1 is pinned by vendored Zed's zbus 5.15/accessibility stack; it handles local session-bus values (WI-3116)" },
    { id = "RUSTSEC-2026-0372", reason = "zvariant_derive 5.15.1 is pinned by vendored Zed's zbus 5.15/accessibility stack; it generates local session-bus serialization (WI-3116)" },
]

[bans]
multiple-versions = "allow"
wildcards = "allow"
# Layering: only the fluent-* crates may depend on gpui. Allowed wrappers:
#   fluent-core, fluent-primitives, fluent-ribbon, fluent-layout, fluent-app,
#   fluent-test-utils           -- the library
#   gallery, demo_app, hello_world, widgets, form, screenshots
#                               -- BASELINE: examples that predate the rule and
#                                  still call gpui directly. Shrink this list as
#                                  they move to fluent-* re-exports; never grow it.
#   gpui_linux, gpui_macros, gpui_platform, gpui_windows, gpui_wgpu
#                               -- the vendored zed closure (vendor/zed) crates
#                                  that depend on gpui directly. They are not
#                                  exempt: each one is listed by name. Keep this
#                                  list in step with the vendor tree; a crate
#                                  that gains a gpui dependency must be added.
# scripts/check-layering.py enforces the layering rule for `gpui_*` crates and
# for `gpui::` paths in source.
deny = [
    { crate = "gpui", wrappers = [
        "fluent-core", "fluent-primitives", "fluent-ribbon", "fluent-layout",
        "fluent-app", "fluent-test-utils",
        "gpui_linux", "gpui_macros", "gpui_platform", "gpui_windows", "gpui_wgpu",
    ] },
]
